# Jenkins local para el laboratorio. El nombre del contenedor debe ser "jenkins":
# el pipeline seguro usa --volumes-from jenkins.
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
